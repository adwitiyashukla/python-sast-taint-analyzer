name: pysast
description: Taint analysis for Python web apps, with results in GitHub code scanning
inputs:
  path:
    description: File or folder to scan
    default: "."
  args:
    description: Extra arguments for pysast scan
    default: ""
  upload:
    description: Upload the SARIF file to GitHub code scanning
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$ACTION_PATH"
    - shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        SCAN_ARGS: ${{ inputs.args }}
      run: pysast scan "$SCAN_PATH" --format sarif --output pysast.sarif --exit-zero $SCAN_ARGS
    - if: inputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: pysast.sarif
        category: pysast
