[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pysast"
version = "0.1.0"
description = "Taint analysis for Python web apps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adwitiya Shukla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
bench = ["bandit==1.9.4", "semgrep==1.181.0"]

[project.scripts]
pysast = "pysast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pysast = ["*.toml"]

[tool.ruff]
line-length = 240
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008"]
